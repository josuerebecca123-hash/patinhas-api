name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release -warnaserror --no-restore

      - name: Testes
        run: dotnet test -c Release --no-build
