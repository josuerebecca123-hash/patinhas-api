<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Patinhas: pet shop fictício, projeto escolar." />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🐾</text></svg>"
    />
    <title>Patinhas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Aplica o tema ANTES da primeira pintura (evita o "flash" de tema errado).
         Ordem: escolha salva no localStorage > preferência do sistema. -->
    <script>
      (function () {
        try {
          var salvo = localStorage.getItem("patinhas.tema");
          var tema =
            salvo === "claro" || salvo === "escuro"
              ? salvo
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "escuro"
                : "claro";
          document.documentElement.setAttribute("data-tema", tema);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
